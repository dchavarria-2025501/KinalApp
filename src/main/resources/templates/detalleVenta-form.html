<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Detalle de Venta - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">🏪 SistemaGestión</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">📊 Dashboard</a>
            <a href="clientes.html" class="nav-link">👥 Clientes</a>
            <a href="productos.html" class="nav-link">📦 Productos</a>
            <a href="ventas.html" class="nav-link">💰 Ventas</a>
            <a href="usuarios.html" class="nav-link">👤 Usuarios</a>
        </div>
    </div>
</nav>

<div class="container">
    <a href="detalleVentas.html" class="back-button">← Regresar a Detalle de Ventas</a>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">➕ Añadir Detalle de Venta</h2>
        </div>

        <form id="detalleForm" onsubmit="showSuccess(event)">
            <div class="form-group">
                <label>ID de Venta *</label>
                <select required>
                    <option value="">Seleccionar venta</option>
                    <option>V001 - María García - $1,250</option>
                    <option>V002 - Juan Pérez - $890</option>
                    <option>V003 - Ana López - $2,100</option>
                </select>
            </div>

            <div class="form-group">
                <label>Producto *</label>
                <select required>
                    <option value="">Seleccionar producto</option>
                    <option>Laptop Pro - $1,299</option>
                    <option>Mouse Inalámbrico - $29</option>
                    <option>Teclado Mecánico - $89</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad *</label>
                <input type="number" required placeholder="1">
            </div>

            <div class="form-group">
                <label>Precio Unitario *</label>
                <input type="number" step="0.01" required placeholder="0.00">
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" onclick="location.href='detalleVentas.html'">Cancelar</button>
                <button type="submit" class="btn btn-primary">💾 Guardar Detalle</button>
            </div>
        </form>
    </div>
</div>

<div id="successModal" class="modal">
    <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h2 class="modal-title">¡Detalle agregado!</h2>
        <p class="modal-text">El detalle de venta ha sido registrado exitosamente (demostración).</p>
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="redirectToDetalleVentas()">Aceptar</button>
        </div>
    </div>
</div>

<script>
    function showSuccess(event) {
        event.preventDefault();
        document.getElementById('successModal').classList.add('show');
    }
    function redirectToDetalleVentas() {
        window.location.href = 'detalleVentas.html';
    }
</script>
</body>
</html>
