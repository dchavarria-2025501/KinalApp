<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Inicio</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #dccab0;
    background-image: linear-gradient(315deg, #dccab0 0%, #e8dbca 74%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: 20px auto;
    background: #ffffff;
    border: 3px solid #8b5e3c;
    border-radius: 12px;
    box-shadow: 12px 12px 0px #8b5e3c;
    overflow: hidden;
}

.header {
    background-color: #5d4037;
    color: #f4f1ea;
    padding: 40px;
    text-align: center;
    border-bottom: 3px solid #8b5e3c;
}

.header h1 {
    font-size: 2.2em;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 40px;
}

.card {
    background: #fafaf8;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    border: 2px solid #8b5e3c;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 5px 5px 0px #8b5e3c;
}

.card a {
    text-decoration: none;
    color: inherit;
    display: block;
}

.card h3 {
    margin-bottom: 12px;
    font-size: 1.6em;
    color: #5d4037;
}

.card p {
    color: #6d4c41;
    font-size: 15px;
    line-height: 1.5;
}

.logout-btn {
    display: inline-block;
    margin-top: 15px;
    background-color: #8b5e3c;
    color: white;
    padding: 10px 25px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid #5d4037;
    transition: 0.3s;
}

.logout-btn:hover {
    background-color: #a0785a;
    color: white;
}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Kinal App</h1>
        <p>Sistema de Gestión</p>
        <a th:href="@{/logout}" class="logout-btn">Cerrar Sesión</a>
    </div>
    <div class="dashboard">
        <div class="card"><a th:href="@{/usuarios}"><h3>Usuarios</h3><p>Gestionar usuarios del sistema</p></a></div>
        <div class="card"><a th:href="@{/clientes}"><h3>Clientes</h3><p>Administrar clientes</p></a></div>
        <div class="card"><a th:href="@{/productos}"><h3>Productos</h3><p>Inventario de productos</p></a></div>
        <div class="card"><a th:href="@{/ventas}"><h3>Ventas</h3><p>Registro de ventas</p></a></div>
        <div class="card"><a th:href="@{/detalleVentas}"><h3>Detalle Ventas</h3><p>Detalle de transacciones</p></a></div>
    </div>
</div>
</body>
</html>
