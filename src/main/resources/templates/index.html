<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Inicio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #e0e0e0;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card h3 { margin-bottom: 10px; font-size: 1.5em; color: #667eea; }
        .card p { color: #666; }
        .logout-btn {
            display: inline-block;
            margin-top: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏪 Kinal App</h1>
        <p>Sistema de Gestión</p>
        <a th:href="@{/logout}" class="logout-btn">🚪 Cerrar Sesión</a>
    </div>
    <div class="dashboard">
        <div class="card"><a th:href="@{/usuarios}">👥 <h3>Usuarios</h3><p>Gestionar usuarios del sistema</p></a></div>
        <div class="card"><a th:href="@{/clientes}">👤 <h3>Clientes</h3><p>Administrar clientes</p></a></div>
        <div class="card"><a th:href="@{/productos}">📦 <h3>Productos</h3><p>Inventario de productos</p></a></div>
        <div class="card"><a th:href="@{/ventas}">💰 <h3>Ventas</h3><p>Registro de ventas</p></a></div>
        <div class="card"><a th:href="@{/detalleVentas}">📋 <h3>Detalle Ventas</h3><p>Detalle de transacciones</p></a></div>
    </div>
</div>
</body>
</html>
