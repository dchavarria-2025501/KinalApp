<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>Nuevo Producto</h1>
<form th:action="@{/vista/productos/guardar}" th:object="${producto}" method="post">
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}">
    <br><br>
    <label>Precio:</label>
    <input type="number" step="0.01" th:field="*{precio}">
    <br><br>
    <label>Stock:</label>
    <input type="number" th:field="*{stock}">
    <br><br>
    <button type="submit">
        Guardar
    </button>
</form>
<br>
<a th:href="@{/vista/productos}">
    Regresar
</a>
</body>
</html>
