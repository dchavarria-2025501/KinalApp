<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Formulario Producto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            color: #667eea;
            margin-bottom: 25px;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        button, .btn-cancelar {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-cancelar {
            background: #6c757d;
            color: white;
            display: inline-block;
            line-height: 42px;
        }
        .btn-guardar:hover, .btn-cancelar:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>
<div class="form-container">
    <h2 th:text="${producto.codigoProducto} ? '✏️ Editar Producto' : '➕ Nuevo Producto'">Formulario</h2>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{codigoProducto}">
        <label>Nombre del producto:</label>
        <input type="text" th:field="*{nombreProducto}" required>
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required>
        <label>Stock:</label>
        <input type="number" th:field="*{stock}" required>
        <div class="buttons">
            <button type="submit" class="btn-guardar">💾 Guardar</button>
            <a th:href="@{/productos}" class="btn-cancelar">❌ Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
