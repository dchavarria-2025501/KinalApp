<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Usuarios</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn-nuevo {
            background: green;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-regresar {
            background: #6c757d;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f2f2f2;
        }

        .btn-editar {
            background: orange;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-eliminar {
            background: red;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="top-bar">

        <h1>Gestión de Usuarios</h1>

        <div class="buttons">

            <a th:href="@{/}" class="btn-regresar">
                ⬅️ Regresar
            </a>

            <a th:href="@{/usuarios/nuevo}" class="btn-nuevo">
                ➕ Nuevo Usuario
            </a>

        </div>

    </div>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.codigoUsuario}"></td>

            <td th:text="${usuario.username}"></td>

            <td th:text="${usuario.email}"></td>

            <td th:text="${usuario.rol}"></td>

            <td th:text="${usuario.estado == 1 ? 'Activo' : 'Inactivo'}"></td>

            <td>

                <button class="btn-editar"
                        onclick="alert('Editar deshabilitado')">
                    ✏️ Editar
                </button>

                <button class="btn-eliminar"
                        onclick="alert('Eliminar deshabilitado')">
                    🗑️ Eliminar
                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
