<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Usuario</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Nuevo Usuario</h1>
<form th:action="@{/vista/usuarios/guardar}" th:object="${usuario}" method="post">
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}">
    <br><br>
    <label>Username:</label>
    <input type="text" th:field="*{username}">
    <br><br>
    <label>Password:</label>
    <input type="text" th:field="*{password}">
    <br><br>
    <button type="submit">
        Guardar
    </button>
</form>
<br>
<a th:href="@{/vista/usuarios}">
    Regresar
</a>
</body>
</html>
