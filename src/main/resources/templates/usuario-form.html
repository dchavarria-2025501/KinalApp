<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Formulario Usuario</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #dccab0;
    background-image: linear-gradient(315deg, #dccab0 0%, #e8dbca 74%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-container {
    background: #ffffff;
    border: 3px solid #8b5e3c;
    border-radius: 12px;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    box-shadow: 10px 10px 0px #8b5e3c;
}

h2 {
    color: #5d4037;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #5d4037;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 2px solid #d4cfc1;
    border-radius: 4px;
    background-color: #fafaf8;
    outline: none;
    transition: 0.3s;
}

input:focus, select:focus {
    border-color: #8b5e3c;
    background-color: #fff;
}

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

button, .btn-cancelar {
    flex: 1;
    padding: 12px;
    font-weight: bold;
    font-size: 14px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    border-radius: 4px;
    transition: 0.3s;
}

.btn-guardar {
    background-color: #8b5e3c;
    color: white;
    border: 2px solid #5d4037;
}

.btn-guardar:hover {
    background-color: #a0785a;
}

.btn-cancelar {
    background-color: #e8dbca;
    color: #5d4037;
    border: 2px solid #8b5e3c;
    line-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-cancelar:hover {
    background-color: #dccab0;
}
    </style>
</head>
<body>
<div class="form-container">
    <h2 th:text="${usuario.codigoUsuario} != null ?
        ' Editar Usuario' :
        ' Nuevo Usuario'">
        Formulario
    </h2>

    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}"
          method="post">

        <input type="hidden" th:field="*{codigoUsuario}">

        <label>Username:</label>
        <input type="text" th:field="*{username}" required>

        <label>Password:</label>
        <input type="password" th:field="*{password}" required>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>

        <label>Rol:</label>
        <select th:field="*{rol}">
            <option value="Admin">Admin</option>
            <option value="Vendedor">Vendedor</option>
            <option value="Bodega">Bodega</option>
        </select>

        <label>Estado:</label>
        <select th:field="*{estado}">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
        </select>
        <div class="buttons">
            <button type="submit" class="btn-guardar">Guardar</button>
            <a th:href="@{/usuarios}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
