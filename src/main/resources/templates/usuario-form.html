<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Formulario Usuario</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button, .btn-cancelar {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn-guardar {
            background: #667eea;
            color: white;
        }

        .btn-cancelar {
            background: gray;
            color: white;
            line-height: 42px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2 th:text="${usuario.codigoUsuario} != null ?
        '✏️ Editar Usuario' :
        '➕ Nuevo Usuario'">
        Formulario
    </h2>

    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}"
          method="post">

        <input type="hidden" th:field="*{codigoUsuario}">

        <label>Username:</label>
        <input type="text" th:field="*{username}" required>

        <label>Password:</label>
        <input type="password" th:field="*{password}" required>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>

        <label>Rol:</label>
        <select th:field="*{rol}">
            <option value="Admin">Admin</option>
            <option value="Vendedor">Vendedor</option>
            <option value="Bodega">Bodega</option>
        </select>

        <label>Estado:</label>
        <select th:field="*{estado}">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
        </select>
        <div class="buttons">
            <button type="submit" class="btn-guardar">
                💾 Guardar
            </button>
            <a th:href="@{/usuarios}" class="btn-cancelar">
                ❌ Cancelar
            </a>
        </div>
    </form>
</div>
</body>
</html>
