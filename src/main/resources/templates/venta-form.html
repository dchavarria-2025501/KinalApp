<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Formulario Venta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #dccab0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .form-container { background: #ffffff; border: 3px solid #8b5e3c; border-radius: 12px; padding: 40px; width: 90%; max-width: 550px; box-shadow: 10px 10px 0px #8b5e3c; }
        h2 { color: #5d4037; text-align: center; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #5d4037; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #d4cfc1; border-radius: 4px; background-color: #fafaf8; outline: none; transition: 0.3s; }
        .buttons { display: flex; gap: 15px; margin-top: 30px; }
        button, .btn-cancelar { flex: 1; padding: 12px; font-weight: bold; font-size: 14px; text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none; border-radius: 4px; transition: 0.3s; }
        .btn-guardar { background-color: #8b5e3c; color: white; border: 2px solid #5d4037; }
        .btn-cancelar { background-color: #e8dbca; color: #5d4037; border: 2px solid #8b5e3c; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Nueva Venta</h2>

    <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

        <input type="hidden" th:field="*{codigoVenta}">

        <label>Fecha de Venta:</label>
        <input type="date" th:field="*{fechaVenta}" required>

        <label>Cliente:</label>
        <select th:field="*{cliente}">
            <option value="" disabled selected>Seleccione un cliente</option>
            <option th:each="c : ${clientes}"
                    th:value="${c.DPICliente}"
                    th:text="${c.nombreCliente + ' ' + c.apellidoCliente}"></option>
        </select>

        <label>Usuario (Vendedor):</label>
        <select th:field="*{usuario}">
            <option value="" disabled selected>Seleccione el vendedor</option>
            <option th:each="u : ${usuarios}"
                    th:value="${u.codigoUsuario}"
                    th:text="${u.username}"></option>
        </select>

        <label>Total (Q):</label>
        <input type="number" th:field="*{total}" step="0.01" required>

        <label>Estado:</label>
        <select th:field="*{estado}">
            <option value="1">Finalizada</option>
            <option value="0">Anulada</option>
        </select>

        <div class="buttons">
            <button type="submit" class="btn-guardar">Registrar Venta</button>
            <a th:href="@{/ventas}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
