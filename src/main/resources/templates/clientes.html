<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Clientes</title>

    <style>

        body{
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .container{
            background:white;
            padding:25px;
            border-radius:15px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            padding:10px;
            border-bottom:1px solid #ccc;
        }

        th{
            background:#667eea;
            color:white;
        }

        .btn{
            padding:6px 12px;
            border-radius:6px;
            border:none;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .editar{
            background:orange;
        }

        .eliminar{
            background:red;
        }

        .nuevo{
            background:#667eea;
            padding:10px 15px;
            margin-bottom:10px;
            display:inline-block;
            text-decoration:none;
            color:white;
        }

        .mensaje{
            position:fixed;
            top:20px;
            right:20px;
            background:#ffc107;
            padding:12px 18px;
            border-radius:8px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Gestión de Clientes</h1>

    <a th:href="@{/clientes/nuevo}" class="nuevo">
        ➕ Nuevo Cliente
    </a>

    <a th:href="@{/}" class="btn-regresar">
        ⬅️ Regresar
    </a>

    <table>

        <thead>

        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="cliente : ${clientes}">

            <td th:text="${cliente.DPICliente}"></td>

            <td th:text="${cliente.nombreCliente}"></td>

            <td th:text="${cliente.apellidoCliente}"></td>

            <td th:text="${cliente.direccion}"></td>

            <td th:text="${cliente.estado}"></td>

            <td>

                <button
                        class="btn editar"
                        onclick="mostrarAdvertencia('Editar')">

                    ✏️ Editar

                </button>

                <button
                        class="btn eliminar"
                        onclick="mostrarAdvertencia('Eliminar')">

                    🗑️ Eliminar

                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script>

    function mostrarAdvertencia(accion){

    const mensaje = document.createElement("div");

    mensaje.className="mensaje";

    mensaje.innerHTML =
    "⚠️ La función de "
    + accion +
    " aún no está disponible.";

    document.body.appendChild(mensaje);

    setTimeout(()=>{
    mensaje.remove();
    },3000);

    }

</script>

</body>
</html>
