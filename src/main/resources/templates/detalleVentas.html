<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Detalle de Ventas</h1>

    <div class="mb-3 text-end">
        <a th:href="@{/vista/detalleVentas/nuevo}" class="btn btn-primary">
            Nuevo Detalle
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-dark text-white">
            Lista de Detalles
        </div>

        <div class="card-body">
            <table class="table table-striped">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="d : ${detalleVentas}">
                    <td th:text="${d.id}"></td>
                    <td th:text="${d.cantidad}"></td>
                    <td th:text="${d.precio}"></td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>
</html>
