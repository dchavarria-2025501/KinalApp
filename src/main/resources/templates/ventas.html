<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Ventas</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #dccab0; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border: 3px solid #8b5e3c; border-radius: 12px; box-shadow: 10px 10px 0px #8b5e3c; }
        h1 { color: #5d4037; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed #d4cfc1; }
        .buttons { display: flex; gap: 12px; }
        .btn-nuevo { background-color: #5d4037; color: white; padding: 10px 20px; border: 2px solid #3e2723; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-nuevo:hover { background-color: #8b5e3c; }
        .btn-regresar { background-color: #f4f1ea; color: #5d4037; padding: 10px 20px; border: 2px solid #8b5e3c; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #8b5e3c; color: white; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; padding: 14px; }
        td { padding: 14px; text-align: center; border-bottom: 1px solid #d4cfc1; }
        tr:hover { background-color: #fcfaf7; }
        .btn-detalle { background-color: #5d4037; color: white; border: 1px solid #3e2723; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>Registro de Ventas</h1>
        <div class="buttons">
            <a th:href="@{/}" class="btn-regresar">Regresar</a>
            <a th:href="@{/ventas/nuevo}" class="btn-nuevo">Nueva Venta</a>
        </div>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Vendedor</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="venta : ${ventas}">
            <td th:text="${venta.codigoVenta}"></td>
            <td th:text="${venta.fechaVenta}"></td>
            <td th:text="${venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente}"></td>
            <td th:text="${venta.usuario.username}"></td>
            <td th:text="'Q' + ${#numbers.formatDecimal(venta.total, 1, 2)}"></td>
            <td th:text="${venta.estado == 1 ? 'Finalizada' : 'Anulada'}"></td>
            <td>
                <button class="btn-detalle" onclick="alert('Ver detalle de venta pendiente')">Ver Detalle</button>
                    <a th:href="@{/detalle_ventas}" class="btn-detalle">Ver Detalle</a>
                <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/ventas/editar/{id}(id=${venta.codigoVenta})}" class="btn-editar">Editar</a>
                    <a th:href="@{/ventas/eliminar/{id}(id=${venta.codigoVenta})}"
                        class="btn-eliminar"
                onclick="return confirm('¿Eliminar esta venta?')">Eliminar</a>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
