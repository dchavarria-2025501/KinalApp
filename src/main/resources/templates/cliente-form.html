<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Cliente - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">🏪 SistemaGestión</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">📊 Dashboard</a>
            <a href="clientes.html" class="nav-link">👥 Clientes</a>
            <a href="productos.html" class="nav-link">📦 Productos</a>
            <a href="ventas.html" class="nav-link">💰 Ventas</a>
            <a href="usuarios.html" class="nav-link">👤 Usuarios</a>
        </div>
    </div>
</nav>

<div class="container">
    <a href="clientes.html" class="back-button">← Regresar a Clientes</a>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">➕ Añadir Nuevo Cliente</h2>
        </div>

        <form id="clienteForm" onsubmit="showSuccess(event)">
            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" required placeholder="Ej: María García López">
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" required placeholder="cliente@email.com">
            </div>

            <div class="form-group">
                <label>Teléfono *</label>
                <input type="tel" required placeholder="555-0101">
            </div>

            <div class="form-group">
                <label>Dirección</label>
                <textarea rows="3" placeholder="Dirección completa"></textarea>
            </div>

            <div class="form-group">
                <label>Fecha de Nacimiento</label>
                <input type="date">
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button type="button" class="btn btn-secondary" onclick="location.href='clientes.html'">Cancelar</button>
                <button type="submit" class="btn btn-primary">💾 Guardar Cliente</button>
            </div>
        </form>
    </div>
</div>

<div id="successModal" class="modal">
    <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h2 class="modal-title">¡Cliente agregado!</h2>
        <p class="modal-text">El cliente ha sido registrado exitosamente (demostración).</p>
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="redirectToClientes()">Aceptar</button>
        </div>
    </div>
</div>

<script>
    function showSuccess(event) {
        event.preventDefault();
        document.getElementById('successModal').classList.add('show');
    }
    function redirectToClientes() {
        window.location.href = 'clientes.html';
    }
    function closeModal() {
        document.getElementById('successModal').classList.remove('show');
    }
</script>
</body>
</html>
