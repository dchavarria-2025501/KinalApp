<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Formulario Cliente</title>

    <style>

        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .cancelar {
            background: gray;
            display: block;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="form-container">

    <h2 th:text="${cliente.DPICliente} ? 'Editar Cliente' : 'Nuevo Cliente'"></h2>

    <form th:action="@{/clientes/guardar}"
          th:object="${cliente}"
          method="post">

        <!-- DPI -->

        <label>DPI:</label>

        <input type="text"
               th:field="*{DPICliente}"
               required>

        <!-- Nombre -->

        <label>Nombre:</label>

        <input type="text"
               th:field="*{nombreCliente}"
               required>

        <!-- Apellido -->

        <label>Apellido:</label>

        <input type="text"
               th:field="*{apellidoCliente}"
               required>

        <!-- Dirección -->

        <label>Dirección:</label>

        <input type="text"
               th:field="*{direccion}"
               required>

        <!-- Estado -->

        <label>Estado:</label>

        <input type="number"
               th:field="*{estado}"
               required>

        <button type="submit">
            Guardar
        </button>

        <a th:href="@{/clientes}"
           class="cancelar">

            Cancelar

        </a>

    </form>

</div>

</body>
</html>
