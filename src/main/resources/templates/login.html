<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kinal App - Login</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #dccab0;
    background-image: linear-gradient(315deg, #dccab0 0%, #e8dbca 74%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background-color: #ffffff;
    border: 3px solid #8b5e3c;
    border-radius: 15px;
    padding: 45px;
    width: 90%;
    max-width: 400px;
    box-shadow: 10px 10px 0px #8b5e3c;
}

h1 {
    color: #5d4037;
    text-align: center;
    text-transform: uppercase;
    font-size: 26px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #8b5e3c;
    font-weight: bold;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 2px solid #dcdcdc;
    border-radius: 5px;
    font-size: 16px;
    background-color: #fafafa;
    outline: none;
}

input:focus {
    border-color: #8b5e3c;
    background-color: #fff;
}

button {
    width: 100%;
    padding: 14px;
    background-color: #8b5e3c;
    color: white;
    border: 2px solid #5d4037;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    background-color: #a0785a;
    border-color: #8b5e3c;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
}

.error {
    background-color: #f8d7da;
    color: #721c24;
    padding: 10px;
    border: 1px solid #f5c6cb;
    border-radius: 5px;
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
}
    </style>
</head>
<body>
<div class="login-container">
    <h1>KinalApp</h1>
    <div class="subtitle">Iniciar Sesión</div>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
        <div th:if="${param.error}">
            <p style="color:red;">
                Usuario o contraseña incorrectos
            </p>
        </div>
    </form>
</div>
</body>
</html>
